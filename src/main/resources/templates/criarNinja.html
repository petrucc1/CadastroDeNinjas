<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar Ninja</title>

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Fundo */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f1f5f9;
            padding: 30px;
        }

        /* Título */
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #f97316;
            text-shadow: 0 0 10px rgba(249, 115, 22, 0.6);
        }

        /* Container do formulário */
        .form-container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #020617;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
        }

        /* Mensagem */
        .mensagem {
            background-color: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            color: #22c55e;
        }

        /* Labels */
        label {
            display: block;
            margin-bottom: 6px;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #f97316;
        }

        /* Inputs */
        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #1e293b;
            background-color: #0f172a;
            color: #f1f5f9;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #f97316;
            box-shadow: 0 0 8px rgba(249, 115, 22, 0.5);
        }

        /* Botão */
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(90deg, #f97316, #dc2626);
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.7);
        }

        /* Link voltar */
        a {
            display: block;
            margin-top: 20px;
            text-align: center;
            text-decoration: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            color: #f97316;
            border: 2px solid #f97316;
            transition: all 0.3s ease;
        }

        a:hover {
            background-color: #f97316;
            color: white;
            box-shadow: 0 0 12px rgba(249, 115, 22, 0.6);
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .form-container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<h1>Criar Ninja</h1>

<div class="form-container">

    <div th:if="${mensagem}" class="mensagem" th:text="${mensagem}"></div>

    <form th:action="@{/ninjas/ui/salvar}" th:object="${ninja}" method="post">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" th:field="*{nome}" required>

        <label for="email">E-mail:</label>
        <input type="text" id="email" th:field="*{email}" required>

        <label for="imgUrl">URL da imagem:</label>
        <input type="text" id="imgUrl" th:field="*{imgUrl}" required>

        <label for="idade">Idade:</label>
        <input type="number" id="idade" th:field="*{idade}" required>

        <label for="ranking">Ranking:</label>
        <input type="text" id="ranking" th:field="*{ranking}">

        <button type="submit">Criar Ninja</button>

    </form>

    <a th:href="@{/ninjas/ui/todos}">⬅ Voltar para a Tabela de Ninjas</a>

</div>

</body>
</html>
