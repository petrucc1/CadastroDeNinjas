<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tabela de Ninjas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f1f5f9;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #f97316;
            text-shadow: 0 0 10px rgba(249, 115, 22, 0.6);
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .btn-criar {
            padding: 10px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            color: white;
            background: linear-gradient(90deg, #f97316, #dc2626);
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.5);
        }

        .btn-criar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 18px rgba(249, 115, 22, 0.9);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #020617;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
        }

        thead {
            background: linear-gradient(90deg, #f97316, #dc2626);
        }

        thead th {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            font-size: 14px;
        }

        tbody tr {
            border-bottom: 1px solid #1e293b;
            transition: all 0.2s ease-in-out;
        }

        tbody tr:hover {
            background-color: rgba(249, 115, 22, 0.1);
            transform: scale(1.01);
        }

        td, th {
            padding: 15px;
            font-size: 14px;
            vertical-align: middle;
        }

        td {
            text-align: center;
        }

        td img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            object-position: top center;
            border-radius: 12px;
            border: 2px solid #f97316;
            transition: transform 0.3s;
        }

        td img:hover {
            transform: scale(1.1);
        }

        td a {
            display: inline-block;
            margin-right: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        td a:nth-child(1) {
            background-color: #2563eb;
            color: white;
        }

        td a:nth-child(1):hover {
            background-color: #1d4ed8;
        }

        td a:nth-child(2) {
            background-color: #facc15;
            color: #000;
        }

        td a:nth-child(2):hover {
            background-color: #eab308;
        }

        td a:nth-child(3) {
            background-color: #dc2626;
            color: white;
        }

        td a:nth-child(3):hover {
            background-color: #b91c1c;
        }

        @media (max-width: 768px) {
            table {
                font-size: 12px;
            }

            td, th {
                padding: 10px;
            }

            img {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>
<body>

<h1>Lista de Ninjas</h1>

<div class="top-bar">
    <a th:href="@{/ninjas/ui/criar}" class="btn-criar">+ Criar Ninja</a>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>E-mail</th>
        <th>Imagem</th>
        <th>Ranking</th>
        <th>Idade</th>
        <th>Missões</th>
        <th>Ações</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="ninja : ${ninjas}">
        <td th:text="${ninja.id}"></td>
        <td th:text="${ninja.nome}"></td>
        <td th:text="${ninja.email}"></td>
        <td>
            <img th:src="@{${ninja.imgUrl}}" alt="Imagem do Ninja"/>
        </td>
        <td th:text="${ninja.ranking}"></td>
        <td th:text="${ninja.idade}"></td>
        <td>
            <span th:if="${ninja.missoes}">
                <span th:text="${ninja.missoes.nome}"></span>
            </span>
            <span th:if="${ninja.missoes == null}">
                Esse ninja não possui nenhuma missão atribuída.
            </span>
        </td>
        <td>
            <a th:href="@{/ninjas/ui/ninja/{id}(id=${ninja.id})}">Ver Detalhes</a>
            <a th:href="@{/ninjas/ui/alterar/{id}(id=${ninja.id})}">Alterar</a>
            <a th:href="@{/ninjas/ui/deletar/{id}(id=${ninja.id})}">Deletar</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
